<!DOCTYPE html>
<html>
	<head>
		<title>Charlie's UB Games!</title>
		<link rel="icon" type="image/x-icon" href="favicon.ico">
		<script src="snow.js"></script>
		<style>
			#snowflakeContainer {
			position: absolute;
			left: 0px;
			top: 0px;
			display: none;
			}
			.snowflake {
			position: fixed;
			background-color: #CCC;
			z-index: 1000;
			pointer-events: none;
			border-radius: 50%;
			width: 10px;
			height: 10px;
			}
			body {
			font-family: sans-serif;
			margin: 0;
			font-size: 20px;
			background-color: #1a1a1a;
			color: #eee;
			background-image: radial-gradient(circle, rgba(255, 255, 255, .15) 1px, transparent 1px);
			background-size: 30px 30px;
			animation: gridMove 10s linear infinite;
			user-select: none;
			}
			@keyframes gridMove {
			0% {
			background-position: 0 0;
			}
			100% {
			background-position: 60px 30px;
			}
			}
			#backgr {
			border-radius: 50px;
			padding: 25px;
			}
			a {
			text-decoration: none;
			color: inherit;
			font-weight: bold;
			}
			a:hover {
			font-weight: 900;
			}

			#announce {
			text-align: center;
			background-color: red;
			color: #000;
			margin-top: 0;
			padding: 10px;
			border-radius: 0 0 10px 10px;
			position: fixed;
			width: 100%;
			}
			#top {
			backdrop-filter: blur(10px) saturate(200%);
			-webkit-backdrop-filter: blur(10px) saturate(200%);
			background-color: rgba(50, 50, 50, .25);
			border: 1px solid rgba(255, 255, 255, .125);
			border-radius: 0 0 10px 10px;
			position: fixed;
			width: 100vw;
			margin-left: 0;
			text-align: center;
			padding: 10px;
			}
			#contentWrapper {
			margin-top: 100px;
			}
			/* Hide Scrollbar hack by Charlie */
			::-webkit-scrollbar {
			width: 0px;
			}
			::-webkit-scrollbar-track {
			background: #ffffff00;
			}
			::-webkit-scrollbar-thumb {
			background: #ffffff00;
			}
			::-webkit-scrollbar-thumb:hover {
			background: #ffffff00;
			}
			fieldset {
			border-radius: 10px;
			}

			#filepath {
				color: #aaf;
			}
		</style>
		<link rel="stylesheet" href="colours.css">
	</head>
	<body>
		<!-- Add when its christmas --><!-- 
			<div id="snowflakeContainer">
				<span class="snowflake"></span>
			</div>-->
		<div id="top">
			<h1 id="title"><span class="anim-text-flow txt">
				<span>C</span><span>h</span><span>a</span><span>r</span><span>l</span><span>i</span><span>e</span><span>'</span><span>s</span><span>
				<span>U</span><span>n</span><span>b</span><span>l</span><span>o</span><span>c</span><span>k</span><span>e</span><span>d</span><span>
				<span>G</span><span>a</span><span>m</span><span>e</span><span>s</span><span>!</span></span>
			</h1>
		</div>
		<div id="backgr">
			<div id="contentWrapper">
				<h1 id="404msg">404</h1>
				<p>File not found</p>
				<h4>Yes, <span id="filepath"></span> Doesn't Exist..</h4>

				<a href="/">You can <i>Fix</i> this by clicking here..</a>
			</div>
		</div>
	</body>
					
	<script>
		document.body.style.display = "none";
		if (location.pathname == "/") {
			window.location.href = "/system";
		} else {
			document.body.style.display = "";
			messages = [":'(", "Awwwww", "Uh Oh", "EPIC F A I L", "Hmmmm", "Nooooooooooooooooooooo!", "This is weird..", "D:"]
			document.getElementById("404msg").innerHTML = messages[Math.floor(Math.random() * messages.length)];
			document.getElementById("filepath").innerHTML = location.pathname;
		}
	</script>
</html>
